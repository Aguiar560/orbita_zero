name = "orbita-zero-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# `ORIGENS` e `SUPABASE_URL` não são segredos: o primeiro é uma lista de sites
# e o segundo é o endereço público do JWKS. Segredo mesmo não existe neste
# Worker, e essa é a vantagem de verificar o token com chave pública.
[vars]
SUPABASE_URL = "https://vzsiorkeykcbcpmismyy.supabase.co"
# O terceiro e o padrao dos deploys de PREVIEW da Vercel, que ganham um host
# por build. Exige o PREFIXO do projeto: `https://*.vercel.app` deixaria
# qualquer site daquele dominio falar com esta API. Ver `casaComPadrao`.
ORIGENS = "http://localhost:5180,https://orbita-zero.vercel.app,https://orbita-zero-*.vercel.app"

[[d1_databases]]
binding = "DB"
database_name = "orbita-zero"
database_id = "12e2e0fd-80ed-4962-8f31-deaaa00ee06a"
