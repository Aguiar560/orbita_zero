name = "orbita-zero-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

# `ORIGENS` e `SUPABASE_URL` não são segredos: o primeiro é uma lista de sites
# e o segundo é o endereço público do JWKS. Segredo mesmo não existe neste
# Worker, e essa é a vantagem de verificar o token com chave pública.
[vars]
SUPABASE_URL = "https://vzsiorkeykcbcpmismyy.supabase.co"
# O quinto e o padrao dos deploys de PREVIEW da Vercel, que ganham um host
# por build. Exige o PREFIXO do projeto: `https://*.vercel.app` deixaria
# qualquer site daquele dominio falar com esta API. Ver `casaComPadrao`.
ORIGENS = "http://localhost:5180,https://orbitazero.com.br,https://www.orbitazero.com.br,https://orbita-zero.vercel.app,https://orbita-zero-*.vercel.app"
# Ative para o primeiro grupo somente depois de aplicar 0022-indicacoes.sql e
# publicar os termos do programa. Mesmo em `0`, a migração precisa existir:
# novas contas são seladas sem indicação para não ganharem vínculo retroativo.
INDICACOES_ATIVAS = "0"
# `INDICACOES_PIX_SECRET` nunca entra aqui. Criar com pelo menos 32 caracteres:
# `wrangler secret put INDICACOES_PIX_SECRET`.

# O gatilho de cinco minutos faz DUAS coisas.
#
# A primeira é avisar das recusas: cinco minutos é o atraso máximo entre um
# defeito começar e alguém ficar sabendo — antes disto o atraso era "até alguém
# reclamar", que em 08/09 foram horas.
#
# A segunda é varrer as cobranças Pix que o webhook não fechou. É o único
# caminho até o crédito que funciona com ninguém olhando: sem ele, um webhook
# perdido somado a uma aba fechada é um jogador que pagou e não recebeu.
#
# O custo é desprezível: 288 execuções por dia contra as 100 mil requisições
# diárias da camada gratuita, e cada uma faz uma leitura no D1 (leitura tem cota
# de 5 milhões). Sem `ALERTA_WEBHOOK` e sem `MP_ACCESS_TOKEN` configurados, as
# duas metades voltam sem fazer nada.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "orbita-zero"
database_id = "12e2e0fd-80ed-4962-8f31-deaaa00ee06a"
