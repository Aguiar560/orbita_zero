<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Provação — Galeria de Assets</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #02070d; color: #d9efff; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #0a2233 0, #030a11 42%, #010409 100%); }
      header { position: sticky; z-index: 10; top: 0; padding: 20px 28px; border-bottom: 1px solid #174765; background: #02070de8; backdrop-filter: blur(16px); }
      h1 { margin: 0; color: #e9f8ff; font-size: 24px; letter-spacing: .12em; text-transform: uppercase; }
      header p { margin: 7px 0 0; color: #72b9d7; font-size: 13px; }
      #filters { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
      button { padding: 7px 12px; color: #8fdcff; border: 1px solid #1e6588; border-radius: 4px; background: #071722; cursor: pointer; text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
      button.active { color: #031017; border-color: #66dcff; background: #66dcff; box-shadow: 0 0 18px #35bfff55; }
      main { padding: 24px 28px 48px; }
      #status { margin-bottom: 16px; color: #5d9fbc; font-size: 12px; }
      #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
      article { min-width: 0; overflow: hidden; border: 1px solid #17445d; border-radius: 8px; background: linear-gradient(145deg, #07141e, #03080d); box-shadow: 0 12px 35px #0008; }
      .preview { display: grid; place-items: center; height: 180px; padding: 14px; background-color: #05090d; background-image: linear-gradient(45deg,#101b22 25%,transparent 25%),linear-gradient(-45deg,#101b22 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#101b22 75%),linear-gradient(-45deg,transparent 75%,#101b22 75%); background-size: 22px 22px; background-position: 0 0,0 11px,11px -11px,-11px 0; }
      img { display: block; width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 8px #009fe744); }
      .meta { padding: 12px 13px 14px; border-top: 1px solid #13384c; }
      strong { display: block; overflow: hidden; color: #dff7ff; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
      small { display: block; margin-top: 6px; color: #548ca5; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
      .error { padding: 20px; color: #ff8292; border: 1px solid #8b2836; background: #2b080d; }
    </style>
  </head>
  <body>
    <header>
      <h1>Provação — Kit visual</h1>
      <p>Galeria técnica dos assets finais de molduras, painéis, estados, detalhes e ícones.</p>
      <nav id="filters" aria-label="Categorias"></nav>
    </header>
    <main>
      <div id="status">Carregando manifesto…</div>
      <section id="grid" aria-live="polite"></section>
    </main>
    <script type="module">
      const base = '/assets/ui/provacao/';
      const labels = { all: 'Todos', backgrounds: 'Fundos', effects: 'Efeitos', floors: 'Pisos', frames: 'Molduras', icons: 'Ícones', modifiers: 'Modificadores', rewards: 'Recompensas', panels: 'Painéis' };
      const filters = document.querySelector('#filters');
      const grid = document.querySelector('#grid');
      const status = document.querySelector('#status');
      let manifest;
      let selected = 'all';

      const render = () => {
        const visible = selected === 'all' ? manifest.assets : manifest.assets.filter((asset) => asset.category === selected);
        status.textContent = `${visible.length} de ${manifest.assetCount} assets finais`;
        grid.innerHTML = visible.map((asset) => `
          <article>
            <div class="preview"><img src="${base}${asset.file}" alt="${asset.id}" loading="lazy" /></div>
            <div class="meta"><strong title="${asset.id}">${asset.id}</strong><small>${asset.width}×${asset.height} · ${asset.format.toUpperCase()}${asset.alpha ? ' · RGBA' : ''}</small></div>
          </article>
        `).join('');
      };

      try {
        manifest = await fetch(`${base}manifest.json`).then((response) => {
          if (!response.ok) throw new Error(`Manifesto HTTP ${response.status}`);
          return response.json();
        });
        const categories = ['all', ...new Set(manifest.assets.map((asset) => asset.category))];
        filters.innerHTML = categories.map((category, index) => `<button class="${index === 0 ? 'active' : ''}" data-category="${category}">${labels[category] ?? category}</button>`).join('');
        filters.addEventListener('click', (event) => {
          const button = event.target.closest('button');
          if (!button) return;
          selected = button.dataset.category;
          filters.querySelectorAll('button').forEach((item) => item.classList.toggle('active', item === button));
          render();
        });
        render();
      } catch (error) {
        status.className = 'error';
        status.textContent = `Falha ao abrir a galeria: ${error.message}`;
      }
    </script>
  </body>
</html>
